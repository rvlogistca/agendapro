name: Build AgendaPro Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 📁 Verificar arquivos
        run: |
          ls -la
          test -f package.json || { echo "ERRO: package.json não encontrado!"; exit 1; }

      - name: ☕ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🏗️ Preparar arquivos web
        run: |
          mkdir -p dist
          cp index.html dist/
          ls -la dist/

      - name: 📱 Configurar Capacitor
        run: |
          # Criar capacitor.config.json manualmente
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.agendapro.app",
            "appName": "AgendaPro",
            "webDir": "dist"
          }
          EOF
          ls -la
          npx cap add android
          npx cap sync android

      - name: 🔨 Construir APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 📤 Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
