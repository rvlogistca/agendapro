name: Build AgendaPro Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 📁 Listar arquivos
        run: ls -la

      - name: ☕ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🏗️ Preparar arquivos web
        run: |
          mkdir -p dist
          cp index.html dist/
          [ -f style.css ] && cp style.css dist/ || true
          ls -la dist/

      - name: 📱 Inicializar Capacitor
        run: |
          npx init @capacitor/cli@latest . --web-dir=dist --app-id=com.agendapro.app --app-name=AgendaPro
          npx cap add android

      - name: 🔄 Sincronizar projeto Android
        run: npx cap sync android

      - name: 🔨 Construir APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 📤 Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
