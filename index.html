:root {
  color-scheme: light dark;
  --bg: light-dark(#fff8fb, #1a1219);
  --surface: light-dark(#ffffff, #261c25);
  --surface2: light-dark(#f8edf3, #342431);
  --text: light-dark(#291522, #fff5fb);
  --muted: light-dark(#7c6877, #c8b7c5);
  --border: light-dark(#eadce5, #493746);
  --pink: #e75d9b;
  --pink2: #bc3d7c;
  --pink-soft: #e75d9b22;
  --green: #20876a;
  --green-soft: #20876a22;
  --orange: #eaa83b;

  --shadow: 0 12px 32px #42122a12;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: none; }
a { color: inherit; }

  z-index: 40;

}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {

.brand h1 { font-size: 22px; letter-spacing: -.6px; }
.brand p { color: #f3ccdf; font-size: 12px; margin-top: 2px; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill {

  padding: 7px 12px;
  font-size: 12px;
  color: #fff;
}
.btn {
  border-radius: 12px;
  padding: 10px 16px;
  background: var(--pink);
  color: white;
  font-weight: 700;
  font-size: 13px;
  transition: .2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: var(--pink2); transform: translateY(-1px); }
.btn.secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn.ghost {
  background: transparent;
  color: white;
  border: 1px solid #ffffff55;
}
.btn.small { padding: 7px 12px; font-size: 12px; }
.btn.danger { background: var(--red); }
.btn.icon {
  width: 36px; height: 36px;
  padding: 0;
  display: grid; place-items: center;
  border-radius: 10px;
  background: var(--surface2);
  color: var(--text);
  font-size: 16px;
}

.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}
.welcome {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.welcome h2 {
  font-size: clamp(22px, 4vw, 30px);
  letter-spacing: -1px;
}
.welcome p { color: var(--muted); font-size: 14px; margin-top: 4px; }

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  transition: .2s;
}
.stat:hover { transform: translateY(-2px); }
.stat-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}
.stat-icon {
  height: 32px; width: 32px;
  border-radius: 10px;
  background: var(--surface2);
  display: grid; place-items: center;
  font-size: 15px;
}
